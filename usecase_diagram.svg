<svg width="680" height="800" viewBox="0 0 680 800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Use case diagram for the Smart Lab Equipment and Slot Reservation Portal</title>
<desc>Student and Lab Technician actors connect to use cases inside the system boundary, with include relationships from Reserve Equipment Slot to Authenticate User and Verify Calibration Status, from Cancel Reservation to Authenticate User, and an extend relationship from Apply Late-Return Penalty to Check-In / Check-Out Equipment.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
.title { font-size: 15px; font-weight: bold; }
.uc-label { font-size: 13px; }
.small { font-size: 11px; }
.actor-label { font-size: 13px; font-weight: bold; }
.uc { fill: #eef6f4; stroke: #0f6e56; stroke-width: 1; }
.uc2 { fill: #f2eefc; stroke: #534ab7; stroke-width: 1; }
.uc3 { fill: #fbeee7; stroke: #993c1d; stroke-width: 1; }
.assoc { stroke: #555; stroke-width: 1; }
.dep { stroke: #333; stroke-width: 1; stroke-dasharray: 4 3; fill:none; }
.actor { stroke: #222; stroke-width: 1.2; fill: none; }
</style>

<rect x="170" y="40" width="380" height="680" rx="12" fill="none" stroke="#888" stroke-width="1"/>
<text class="title" x="360" y="62" text-anchor="middle">Smart lab equipment &amp; slot reservation portal</text>

<g><ellipse class="uc" cx="360" cy="100" rx="130" ry="24"/><text class="uc-label" x="360" y="104" text-anchor="middle">Authenticate user</text></g>
<g><ellipse class="uc" cx="360" cy="180" rx="130" ry="24"/><text class="uc-label" x="360" y="184" text-anchor="middle">Reserve equipment slot</text></g>
<g><ellipse class="uc" cx="360" cy="260" rx="130" ry="24"/><text class="uc-label" x="360" y="264" text-anchor="middle">Verify calibration status</text></g>
<g><ellipse class="uc2" cx="360" cy="340" rx="130" ry="24"/><text class="uc-label" x="360" y="344" text-anchor="middle">View equipment availability</text></g>
<g><ellipse class="uc2" cx="360" cy="420" rx="130" ry="24"/><text class="uc-label" x="360" y="424" text-anchor="middle">Cancel reservation</text></g>
<g><ellipse class="uc3" cx="360" cy="500" rx="130" ry="24"/><text class="uc-label" x="360" y="504" text-anchor="middle">Check-in / check-out equipment</text></g>
<g><ellipse class="uc3" cx="360" cy="580" rx="130" ry="24"/><text class="uc-label" x="360" y="584" text-anchor="middle">Apply late-return penalty</text></g>
<g><ellipse class="uc3" cx="360" cy="660" rx="130" ry="24"/><text class="uc-label" x="360" y="664" text-anchor="middle">Manage equipment calibration</text></g>

<line class="assoc" x1="70" y1="260" x2="230" y2="100"/>
<line class="assoc" x1="70" y1="260" x2="230" y2="180"/>
<line class="assoc" x1="70" y1="260" x2="230" y2="340"/>
<line class="assoc" x1="70" y1="260" x2="230" y2="420"/>
<line class="assoc" x1="610" y1="420" x2="490" y2="100"/>
<line class="assoc" x1="610" y1="420" x2="490" y2="500"/>
<line class="assoc" x1="610" y1="420" x2="490" y2="660"/>

<circle class="actor" cx="70" cy="210" r="14"/>
<line class="actor" x1="70" y1="224" x2="70" y2="270"/>
<line class="actor" x1="54" y1="240" x2="86" y2="240"/>
<line class="actor" x1="70" y1="270" x2="56" y2="302"/>
<line class="actor" x1="70" y1="270" x2="84" y2="302"/>
<text class="actor-label" x="70" y="322" text-anchor="middle">Student</text>

<circle class="actor" cx="610" cy="370" r="14"/>
<line class="actor" x1="610" y1="384" x2="610" y2="430"/>
<line class="actor" x1="594" y1="400" x2="626" y2="400"/>
<line class="actor" x1="610" y1="430" x2="596" y2="462"/>
<line class="actor" x1="610" y1="430" x2="624" y2="462"/>
<text class="actor-label" x="610" y="482" text-anchor="middle">Lab technician</text>

<line class="dep" x1="360" y1="156" x2="360" y2="124" marker-end="url(#arrow)"/>
<text class="small" x="374" y="140">&#171;include&#187;</text>

<line class="dep" x1="360" y1="204" x2="360" y2="236" marker-end="url(#arrow)"/>
<text class="small" x="374" y="220">&#171;include&#187;</text>

<path class="dep" d="M490 420 L512 420 L512 100 L490 100" marker-end="url(#arrow)"/>
<text class="small" x="516" y="264">&#171;include&#187;</text>

<line class="dep" x1="360" y1="556" x2="360" y2="524" marker-end="url(#arrow)"/>
<text class="small" x="374" y="540">&#171;extend&#187;</text>

<line class="assoc" x1="200" y1="740" x2="240" y2="740"/>
<text class="small" x="248" y="744">Association</text>
<line class="dep" x1="350" y1="740" x2="390" y2="740"/>
<text class="small" x="398" y="744">Include / extend (dashed, arrow to base/target)</text>
</svg>
